name: tui-model-go

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  record-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: modeling/tui
    env:
      GOTOOLCHAIN: local
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.3'
          check-latest: false
          cache: false
      - name: Check compiler formatting
        run: test -z "$(gofmt -l .)"
      - name: Compile and exercise generated browser and model change
        run: go test -race -count=1 -p=1 ./...
      - name: Check compiler
        run: go vet ./...
      - name: Check repository drift
        run: git diff --exit-code
