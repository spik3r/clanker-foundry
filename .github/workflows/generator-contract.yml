name: generator-contract

on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: modeling/gencontract
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.4'
          check-latest: false
          cache: false
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Run conformance harness and its self-tests
        run: go test -race -count=1 ./...
      - name: Vet
        run: go vet ./...
