name: model-authoring-contract
on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.4'
          check-latest: false
          cache: false
      - run: npm ci --prefix runtime --ignore-scripts --no-fund --no-audit
      - run: >-
          node --test
          modeling/lifecycle/authoring/schema.test.cjs
          modeling/tui/authoring/schema.test.cjs
          modeling/jsonvalidator/authoring/schema.test.cjs
          modeling/diagram/authoring/schema.test.cjs
          modeling/diagram/authoring/dashboard.schema.test.cjs
          modeling/diagram/authoring/sequence.schema.test.cjs
          modeling/diagram/authoring/class.schema.test.cjs
