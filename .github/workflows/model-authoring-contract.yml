name: model-authoring-contract
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix runtime --ignore-scripts --no-fund --no-audit
      - run: node --test modeling/lifecycle/authoring/schema.test.cjs
