name: validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Hard gate: conventions from AGENTS.md must hold.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run pack validator
        run: bash scripts/validate.sh

  # Advisory: surfaces shell issues without blocking merges.
  shellcheck:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Check scripts
        run: shellcheck scripts/*.sh global-agents/*.sh
