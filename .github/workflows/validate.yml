name: validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Hard gate: conventions from AGENTS.md must hold.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GNU Stow
        run: sudo apt-get update && sudo apt-get install -y stow
      - name: Run pack validator
        run: bash scripts/validate.sh
      - name: Run installer regression tests
        run: bash tests/test-install.sh

  # Read-only evidence check. Required-status configuration is a separate owner decision.
  project-memory:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test Project Memory lifecycle rules
        run: node --test tests/project-memory.test.mjs
      - name: Verify committed pull-request lifecycle evidence
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node skills/project-memory/scripts/project-memory.mjs validate --base "$BASE_SHA"

  # Advisory: surfaces shell issues without blocking merges.
  shellcheck:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Check scripts
        run: shellcheck scripts/*.sh global-agents/*.sh tests/*.sh
