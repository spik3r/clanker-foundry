name: json-validator-go

on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  json-validator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: modeling/jsonvalidator
    env:
      GOTOOLCHAIN: local
      GOPROXY: 'off'
      GOSUMDB: 'off'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.3'
          check-latest: false
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify compiler and formatting
        run: |
          test "$(go env GOVERSION)" = go1.27.3
          test -z "$(gofmt -l .)"
          node --version
      - name: Execute compiler and emitted-language tests
        run: go test -race -count=1 ./...
      - name: Static checks
        run: go vet ./...
      - name: Execute frozen synthetic TypeScript acceptance
        run: node verify/typescript.mjs
      - name: Check generated drift without overwriting saved output
        run: |
          output=$(mktemp -d)
          go run ./cmd/jsonvalidator -model testdata/sample/model.json -out "$output/generated"
          diff -u testdata/sample/validator.go "$output/generated/validator.go"
          diff -u testdata/sample/validator.ts "$output/generated/validator.ts"
          git diff --exit-code
