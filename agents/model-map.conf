# Map portable model tiers to the aliases supported by each client.
# Edit this file when your available models or cost preferences change.
# Format: <client>.<tier>=<model>

claude.fast=haiku
claude.balanced=sonnet
claude.flagship=opus

# This Codex setup exposes terra and sol. Use terra for fast and balanced work;
# change fast to a lower-cost model alias if your Codex client exposes one.
codex.fast=gpt-5.6-terra
codex.balanced=gpt-5.6-terra
codex.flagship=gpt-5.6-sol
